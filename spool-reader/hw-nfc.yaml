## NFC
external_components:
  - source:
      type: local
      path: components
    components: [bambu_nfc]

spi:
  - id: nfc_spi
    clk_pin: GPIO18
    mosi_pin: GPIO15
    miso_pin: GPIO44

bambu_nfc:
  spi_id: nfc_spi
  cs_pin: GPIO43
  update_interval: 1s
  filament_type:
    id: filament_type_sens
    name: "Type de filament"
  filament_color:
    id: filament_color_sens
    name: "Couleur du filament"
  filament_color_name:
    id: filament_color_name_sens
    name: "Nom couleur"
  filament_subtype:
    id: filament_subtype_sens
    name: "Sous-type filament"
  tray_info_idx:
    id: tray_info_idx_sens
    name: "Code filament"
  variant_id:
    id: variant_id_sens
    name: "Variant ID"
  card_uid:
    id: card_uid_sens
    name: "Card UID"
  tray_uid:
    id: tray_uid_sens
    name: "Tray UID"
  production_date:
    name: "Date de production"
  last_scan_date:
    id: last_scan_date_sens
    name: "Dernier scan"
  min_hotend_temp:
    id: min_hotend_temp_sens
    name: "Temp min buse"
  max_hotend_temp:
    id: max_hotend_temp_sens
    name: "Temp max buse"
  spool_weight:
    id: spool_weight_sens
    name: "Poids bobine"
  nozzle_diameter:
    name: "Diamètre buse"
  spool_width:
    name: "Largeur bobine"
  filament_length:
    id: filament_length_sens
    name: "Longueur filament"
  material_density:
    id: material_density_sens
    name: "Densité matériau"
  reset:
    name: "Reset filament"