substitutions:
  bambuddy_url: !secret bambuddy_url
  bambuddy_api_key: !secret bambuddy_api_key

esphome:
  name: spool-reader
  friendly_name: spool-reader

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: git
      url: https://github.com/BluetriX/esphome-CST328-Touch
    components: [cst328]

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret spool_reader_api_encryption_key

ota:
  - platform: esphome
    password: !secret spool_reader_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Spool-Reader Fallback Hotspot"
    password: !secret spool_reader_ap_password

captive_portal:

packages:
  display: github://bemble/esphome-bambuddy-reader/spool-reader/hw-display.yaml
  fonts: github://bemble/esphome-bambuddy-reader/spool-reader/ui-fonts.yaml
  nfc: github://bemble/esphome-bambuddy-reader/spool-reader/hw-nfc.yaml
  bambuddy: github://bemble/esphome-bambuddy-reader/spool-reader/api-bambuddy.yaml
  styles: github://bemble/esphome-bambuddy-reader/spool-reader/ui-styles.yaml
  page_idle: github://bemble/esphome-bambuddy-reader/spool-reader/page-idle.yaml
  page_filament: github://bemble/esphome-bambuddy-reader/spool-reader/page-filament.yaml
  page_details: github://bemble/esphome-bambuddy-reader/spool-reader/page-details.yaml
  triggers: github://bemble/esphome-bambuddy-reader/spool-reader/pages-triggers.yaml