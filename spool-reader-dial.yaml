# Bambu spool reader — portage M5Stack Dial (ESP32-S3 + WS1850S + GC9A01A rond)
substitutions:
  bambuddy_url: !secret bambuddy_url
  bambuddy_api_key: !secret bambuddy_api_key

esphome:
  name: spool-reader-dial
  friendly_name: spool-reader-dial
  platformio_options:
    board_build.flash_mode: dio

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

external_components:
  # Depuis HA : remplacer par
  #   source: github://<ton-user>/esphome-bambuddy-reader/components@m5dial
  - source:
      type: local
      path: components
    components: [bambu_rc522]

logger:

api:
  encryption:
    key: !secret spool_reader_api_encryption_key

ota:
  - platform: esphome
    password: !secret spool_reader_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Spool-Reader-Dial Fallback"
    password: !secret spool_reader_ap_password

captive_portal:

packages:
  hardware: !include spool-reader-dial/hw-dial.yaml
  nfc: !include spool-reader-dial/hw-nfc.yaml
  fonts: !include spool-reader/ui-fonts.yaml
  bambuddy: !include spool-reader/api-bambuddy.yaml
  styles: !include spool-reader-dial/ui-styles.yaml
  page_idle: !include spool-reader-dial/page-idle.yaml
  page_filament: !include spool-reader-dial/page-filament.yaml
  page_details: !include spool-reader-dial/page-details.yaml
  triggers: !include spool-reader-dial/pages-triggers.yaml
  controls: !include spool-reader-dial/controls.yaml
