## Encoder + button navigation
# Current page: 0 = idle, 1 = filament, 2 = details
globals:
  - id: current_page
    type: int
    initial_value: "0"

sensor:
  - platform: rotary_encoder
    id: dial_encoder
    internal: true
    pin_a:
      number: GPIO40
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO41
      mode:
        input: true
        pullup: true
    on_clockwise:
      then:
        - if:
            condition:
              lambda: 'return id(current_page) == 2;'
            then:
              - lambda: 'lv_obj_scroll_by_bounded(id(details_list), 0, -28, LV_ANIM_ON);'
            else:
              - if:
                  condition:
                    lambda: 'return id(current_page) == 1;'
                  then:
                    - lambda: 'id(current_page) = 2;'
                    - lvgl.page.show: page_details
    on_anticlockwise:
      then:
        - if:
            condition:
              lambda: 'return id(current_page) == 2;'
            then:
              - lambda: 'lv_obj_scroll_by_bounded(id(details_list), 0, 28, LV_ANIM_ON);'

binary_sensor:
  - platform: gpio
    id: dial_button
    internal: true
    pin:
      number: GPIO42
      inverted: true   # remove if presses are detected inverted
      mode:
        input: true
        pullup: true
    on_click:
      # Short press: filament <-> details
      - min_length: 30ms
        max_length: 600ms
        then:
          - if:
              condition:
                lambda: 'return id(current_page) == 1;'
              then:
                - lambda: 'id(current_page) = 2;'
                - lvgl.page.show: page_details
              else:
                - if:
                    condition:
                      lambda: 'return id(current_page) == 2;'
                    then:
                      - lambda: 'id(current_page) = 1;'
                      - lvgl.page.show: page_filament
                    else:
                      # Idle page: toggle signal diagnostic mode
                      - switch.toggle: sw_diag
      # Long press: add to BambuBuddy if the spool is unknown, otherwise back to idle
      - min_length: 900ms
        max_length: 5s
        then:
          - if:
              condition:
                lambda: |-
                  return id(current_page) == 1 &&
                         !lv_obj_has_flag(id(btn_add_bambuddy), LV_OBJ_FLAG_HIDDEN);
              then:
                - script.execute: bambuddy_add_spool
                - rtttl.play: "add:d=16,o=6,b=200:c,e,g"
              else:
                - if:
                    condition:
                      lambda: 'return id(current_page) == 0;'
                    then:
                      # Idle screen: tare the scale
                      - lambda: 'id(spoolbuddy_device).tare();'
                      - rtttl.play: "tare:d=16,o=6,b=200:c,c"
                      - lvgl.label.update:
                          id: error_label
                          text: "${t_tared}"
                      - delay: 2s
                      - lvgl.label.update:
                          id: error_label
                          text: ""
                    else:
                      - lambda: 'id(current_page) = 0;'
                      - lvgl.page.show: page_idle
