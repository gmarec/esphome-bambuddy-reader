## Ecran d'attente (rond 240x240)
lvgl:
  pages:
    - id: page_idle
      styles: style_page
      widgets:
        # Statut Bambuddy (vert = configure) — en haut, centre (les coins sont hors ecran)
        - label:
            id: lbl_sync_icon
            align: TOP_MID
            y: 14
            text: "\U000F04E8"
            text_color: 0x555555
            text_font: font_large
        - arc:
            align: CENTER
            y: -35
            width: 100
            height: 100
            start_angle: 210
            end_angle: 330
            arc_width: 3
            arc_opa: TRANSP
            indicator:
              arc_color: 0x3D6B3D
              arc_width: 3
            value: 100
            adjustable: false
            clickable: false
        - arc:
            align: CENTER
            y: -35
            width: 72
            height: 72
            start_angle: 210
            end_angle: 330
            arc_width: 3
            arc_opa: TRANSP
            indicator:
              arc_color: 0x4A8A4A
              arc_width: 3
            value: 100
            adjustable: false
            clickable: false
        - arc:
            align: CENTER
            y: -35
            width: 48
            height: 48
            start_angle: 210
            end_angle: 330
            arc_width: 3
            arc_opa: TRANSP
            indicator:
              arc_color: 0x5AAA5A
              arc_width: 3
            value: 100
            adjustable: false
            clickable: false
        - obj:
            align: CENTER
            y: -35
            width: 20
            height: 20
            radius: 10
            bg_color: 0x00AE42
            bg_opa: COVER
            border_width: 0
        - label:
            align: CENTER
            y: 28
            width: 200
            text: "Scanner un filament"
            styles: style_text_primary
        - label:
            align: CENTER
            y: 56
            width: 200
            text: "Posez la flasque"
            styles: style_text_secondary
        - label:
            id: error_label
            align: BOTTOM_MID
            y: -40
            width: 180
            text: ""
            text_color: 0xFF4444
            text_font: font_medium
            text_align: CENTER
        - label:
            align: BOTTOM_MID
            y: -16
            text: "BAMBUDDY DIAL"
            text_color: 0x555555
            text_font: font_tiny
