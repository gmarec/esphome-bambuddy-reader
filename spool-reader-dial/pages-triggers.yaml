# NFC → UI triggers

globals:
  - id: parsed_color
    type: uint32_t
    initial_value: "0x808080"
  - id: color_lum
    type: float
    initial_value: "0.5"

bambu_rc522:
  on_bambu_success:
    then:
      - rtttl.play: "ok:d=32,o=6,b=200:e,a"
      - script.execute: show_filament
      # Sync BambuBuddy
      - script.execute: bambuddy_sync
  # NTAG tag (non-Bambu): identified by its UID with BambuBuddy
  on_ntag_tag:
    then:
      - rtttl.play: "ok:d=32,o=6,b=200:e,a"
      - script.execute: bambuddy_ntag_lookup
  on_bambu_error:
    then:
      - rtttl.play: "err:d=8,o=4,b=160:c"
      - lambda: 'id(current_page) = 0;'
      - lvgl.page.show: page_idle
      - lvgl.label.update:
          id: error_label
          text: "Tag not read"
      - delay: 3s
      - lvgl.label.update:
          id: error_label
          text: ""
script:
  # Fills the filament + details pages from the filament sensors, then shows the filament page.
  # Shared by Bambu tags (sensors filled by the reader) and NTAG tags (filled from BambuBuddy).
  - id: show_filament
    then:
      # Reset remaining weight + add button
      - lvgl.label.update:
          id: lbl_remaining
          text: ""
      - lvgl.label.update:
          id: lbl_detail_remaining
          text: ""
      - lvgl.widget.update:
          id: btn_add_bambuddy
          hidden: true
      # Parse the color once
      - lambda: |-
          auto hex = id(filament_color_sens).state;
          if (hex.length() >= 7) {
            id(parsed_color) = strtol(hex.c_str() + 1, NULL, 16);
          } else {
            id(parsed_color) = 0x808080;
          }
          uint32_t c = id(parsed_color);
          id(color_lum) = (0.299f * ((c >> 16) & 0xFF) + 0.587f * ((c >> 8) & 0xFF) + 0.114f * (c & 0xFF)) / 255.0f;
      # Banner color
      - lvgl.widget.update:
          id: color_banner
          bg_color: !lambda 'return lv_color_hex(id(parsed_color));'
      # Darkened circle
      - lvgl.widget.update:
          id: color_circle
          bg_color: !lambda |-
            uint32_t c = id(parsed_color);
            return lv_color_make(((c >> 16) & 0xFF) * 2 / 3, ((c >> 8) & 0xFF) * 2 / 3, (c & 0xFF) * 2 / 3);
          border_color: !lambda |-
            uint32_t c = id(parsed_color);
            if (id(color_lum) < 0.35f)
              return lv_color_make(180, 180, 180);
            return lv_color_make(((c >> 16) & 0xFF) / 2, ((c >> 8) & 0xFF) / 2, (c & 0xFF) / 2);
      # Spaced type + subtype + auto contrast
      - lvgl.label.update:
          id: lbl_type_spaced
          text: !lambda |-
            auto type = id(filament_type_sens).state;
            std::string spaced;
            for (size_t i = 0; i < type.length(); i++) {
              if (i > 0) spaced += ' ';
              spaced += toupper(type[i]);
            }
            auto sub = id(filament_subtype_sens).state;
            if (!sub.empty()) {
              spaced += "  ·  ";
              spaced += sub;
            }
            return spaced.c_str();
          text_color: !lambda 'return lv_color_hex(id(color_lum) > 0.5f ? 0x000000 : 0xFFFFFF);'
      # Color name + auto contrast
      - lvgl.label.update:
          id: lbl_color_name
          text: !lambda 'return id(filament_color_name_sens).state.c_str();'
          text_color: !lambda 'return lv_color_hex(id(color_lum) > 0.5f ? 0x000000 : 0xFFFFFF);'
      # Details — circle
      - lvgl.widget.update:
          id: detail_circle
          bg_color: !lambda 'return lv_color_hex(id(parsed_color));'
      # Details — header
      - lvgl.label.update:
          id: lbl_detail_header
          text: !lambda |-
            auto t = id(filament_type_sens).state;
            auto s = id(filament_subtype_sens).state;
            if (!s.empty()) t += " · " + s;
            return t.c_str();
      # Details — values
      - lvgl.label.update:
          id: lbl_detail_type
          text: !lambda 'return id(filament_type_sens).state.c_str();'
      - lvgl.label.update:
          id: lbl_detail_color
          text: !lambda 'return id(filament_color_name_sens).state.c_str();'
      - lvgl.label.update:
          id: lbl_detail_hex
          text: !lambda 'return id(filament_color_sens).state.c_str();'
      - lvgl.label.update:
          id: lbl_detail_hotend
          text: !lambda |-
            static char buf[32];
            if (std::isnan(id(min_hotend_temp_sens).state)) return "—";
            snprintf(buf, sizeof(buf), "%.0f - %.0f°C",
              id(min_hotend_temp_sens).state, id(max_hotend_temp_sens).state);
            return buf;
      - lvgl.label.update:
          id: lbl_detail_weight
          text: !lambda |-
            static char buf[16];
            if (std::isnan(id(spool_weight_sens).state)) return "—";
            snprintf(buf, sizeof(buf), "%.0f g", id(spool_weight_sens).state);
            return buf;
      - lvgl.label.update:
          id: lbl_detail_tray_uid
          text: !lambda |-
            auto uid = id(tray_uid_sens).state;
            if (uid.length() > 12) return (uid.substr(0, 6) + "..." + uid.substr(uid.length() - 6)).c_str();
            return uid.c_str();
      - lvgl.label.update:
          id: lbl_detail_code
          text: !lambda |-
            static std::string s;
            s = id(tray_info_idx_sens).state + " " + id(variant_id_sens).state;
            return s.c_str();
      - lvgl.label.update:
          id: lbl_detail_bed
          text: !lambda |-
            static char buf[16];
            if (std::isnan(id(bed_temp_sens).state)) return "—";
            snprintf(buf, sizeof(buf), "%.0f°C", id(bed_temp_sens).state);
            return buf;
      - lvgl.label.update:
          id: lbl_detail_dry
          text: !lambda |-
            static char buf[24];
            if (std::isnan(id(drying_temp_sens).state)) return "—";
            snprintf(buf, sizeof(buf), "%.0f°C / %.0f h", id(drying_temp_sens).state, id(drying_time_sens).state);
            return buf;
      # Show filament page
      - lambda: 'id(current_page) = 1;'
      - lvgl.page.show: page_filament
