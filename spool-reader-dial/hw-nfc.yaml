## NFC — reader selected by the nfc_* substitutions in spool-reader-dial.yaml
##   ws1850s: the Dial's internal reader (internal_i2c bus, 0x28)
##   pn532  : external module on Grove port A (grove_i2c bus, 0x24)
bambu_rc522:
  id: nfc_reader
  reader: ${nfc_reader}
  i2c_id: ${nfc_i2c}
  address: ${nfc_address}
  update_interval: 200ms
  filament_type:
    id: filament_type_sens
    name: "Filament type"
  filament_color:
    id: filament_color_sens
    name: "Filament color"
  filament_color_name:
    id: filament_color_name_sens
    name: "Color name"
  filament_subtype:
    id: filament_subtype_sens
    name: "Filament subtype"
  tray_info_idx:
    id: tray_info_idx_sens
    name: "Filament code"
  variant_id:
    id: variant_id_sens
    name: "Variant ID"
  card_uid:
    id: card_uid_sens
    name: "Card UID"
  tray_uid:
    id: tray_uid_sens
    name: "Tray UID"
  production_date:
    id: production_date_sens
    name: "Production date"
  last_scan_date:
    id: last_scan_date_sens
    name: "Last scan"
  min_hotend_temp:
    id: min_hotend_temp_sens
    name: "Nozzle temp min"
  max_hotend_temp:
    id: max_hotend_temp_sens
    name: "Nozzle temp max"
  bed_temp:
    id: bed_temp_sens
    name: "Bed temp"
  drying_temp:
    id: drying_temp_sens
    name: "Drying temp"
  drying_time:
    id: drying_time_sens
    name: "Drying time"
  spool_weight:
    id: spool_weight_sens
    name: "Spool weight"
  filament_diameter:
    id: filament_diameter_sens
    name: "Filament diameter"
  nozzle_diameter:
    name: "Nozzle diameter"
  spool_width:
    name: "Spool width"
  filament_length:
    id: filament_length_sens
    name: "Filament length"
  material_density:
    id: material_density_sens
    name: "Material density"
  reset:
    name: "Reset filament"
