                        id: lbl_detail_remaining
                        align: RIGHT_MID
                        text: "--"
                        text_color: 0xFFFFFF
                        text_font: font_small
        - label:
            align: BOTTOM_MID
            y: -12
            text: "appui : retour"
            styles: style_hint
